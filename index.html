<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Previewer</title>
<style>
  * { box-sizing: border-box; margin: 0; font-family: system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 1fr 1fr; height: 100vh; }
  textarea { border: 0; border-right: 1px solid #ddd; padding: 1.2rem; font: 14px/1.5 ui-monospace, monospace; resize: none; outline: none; }
  #out { padding: 1.2rem; overflow: auto; line-height: 1.6; }
  #out h1, #out h2 { margin: .8rem 0 .4rem; }
  #out code { background: #f0ede6; padding: .1rem .35rem; border-radius: 4px; font-family: ui-monospace, monospace; }
  #out pre { background: #2c2418; color: #fdf3ee; padding: .8rem; border-radius: 8px; overflow: auto; }
  #out pre code { background: none; padding: 0; }
  #out blockquote { border-left: 3px solid #e07a3f; padding-left: .8rem; color: #666; margin: .6rem 0; }
  @media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } textarea { border-right: 0; border-bottom: 1px solid #ddd; } }
</style>
</head>
<body>
<textarea id="in" spellcheck="false"># Markdown previewer

Type **markdown** on the left, see it rendered on the right.

## Supports

- Headings, **bold**, *italic*, `code`
- Lists and [links](https://example.com)
- > Blockquotes

```js
console.log("code blocks too");
```
</textarea>
<div id="out"></div>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
const inp = document.getElementById('in'), out = document.getElementById('out');
function render() {
  if (window.marked) {
    out.innerHTML = marked.parse(inp.value, { breaks: true });
  } else {
    out.textContent = 'Preview library failed to load. Raw markdown:';
  }
}
inp.addEventListener('input', render);
render();
</script>
</body>
</html>
